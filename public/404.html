<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Tools</title>
    <!--
      GitHub Pages has no server-side router, so a direct visit or refresh on
      /my-tools/word-counter 404s. This page catches that 404, encodes the
      path into a query string, and redirects to index.html, which decodes it
      back (see the script in index.html) so React Router can take over.
      Source pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var segmentCount = 1 // number of path segments that make up the base ("/my-tools/" = 1)
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
